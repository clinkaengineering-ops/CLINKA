# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy backend API with WebSocket support (Socket.IO).
services:
  - type: web
    name: clinka-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: PAYMOB_BASE_URL
        value: https://accept.paymob.com
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_INTEGRATION_IDS
        sync: false
      - key: PAYMOB_CURRENCY
        value: EGP
      - key: PLATFORM_COMMISSION_RATE
        value: "0.1"
      - key: PAYMOB_DEV_FALLBACK
        value: "false"
      - key: PAYMOB_PAYOUT_BASE_URL
        value: https://payouts.paymobsolutions.com/api/secure
      - key: PAYMOB_PAYOUT_CLIENT_ID
        sync: false
      - key: PAYMOB_PAYOUT_CLIENT_SECRET
        sync: false
      - key: PAYMOB_PAYOUT_USERNAME
        sync: false
      - key: PAYMOB_PAYOUT_PASSWORD
        sync: false
      - key: PAYMOB_PAYOUT_DEV_FALLBACK
        value: "false"
      - key: SUPPORT_EMAIL
        value: support@clinka.com
      - key: REDIS_URL
        sync: false
