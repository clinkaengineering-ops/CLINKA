name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Unit & API Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinka_test
      JWT_SECRET: test-dummy-jwt-secret-minimum-32-chars-long!
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Type check backend TypeScript
        run: npx tsc --noEmit

      - name: Build backend
        run: npm run build

      - name: Run backend unit and API tests with coverage
        run: npm run test:coverage

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

  frontend:
    name: Frontend (Unit & Component Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check frontend TypeScript
        run: npx tsc --noEmit

      - name: Run frontend unit and component tests with coverage
        run: npm run test:coverage

      - name: Build Next.js production bundle
        run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinka_test
      JWT_SECRET: test-dummy-jwt-secret-minimum-32-chars-long!
      PAYOUT_FIELD_ENCRYPTION_KEY: test-encryption-key-32chars!!!
      NODE_ENV: test
      CLIENT_URL: http://localhost:3000
      API_URL: http://localhost:5000
      EMAIL_USER: dummy@clinkaeng.com
      RESEND_API_KEY: re_dummy_key_for_testing
      GOOGLE_CLIENT_ID: dummy_google_client_id
      GOOGLE_CLIENT_SECRET: dummy_google_client_secret
      PAYMOB_SECRET_KEY: dummy_paymob_secret
      PAYMOB_PUBLIC_KEY: dummy_paymob_public
      PAYMOB_HMAC_SECRET: dummy_paymob_hmac
      PAYMOB_INTEGRATION_IDS: "12345"
      RATE_LIMIT_DISABLED: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run Prisma migrations against test Postgres
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run disputes integration test
        run: npm run test:integration

  audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run backend security audit
        continue-on-error: true
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Run frontend security audit
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  deploy:
    name: Coolify Continuous Deployment
    needs: [backend, frontend, backend-integration]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - name: Deploy Backend to Coolify
        env:
          COOLIFY_BACKEND_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK || secrets.COOLIFY_BACKEND_URL || secrets.COOLIFY_WEBHOOK }}
        if: env.COOLIFY_BACKEND_WEBHOOK != ''
        run: |
          echo "Triggering Coolify backend deployment webhook..."
          curl -f -s -S -X POST "$COOLIFY_BACKEND_WEBHOOK" || curl -f -s -S -X GET "$COOLIFY_BACKEND_WEBHOOK"

      - name: Deploy Frontend to Coolify
        env:
          COOLIFY_FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK || secrets.COOLIFY_FRONTEND_URL }}
        if: env.COOLIFY_FRONTEND_WEBHOOK != ''
        run: |
          echo "Triggering Coolify frontend deployment webhook..."
          curl -f -s -S -X POST "$COOLIFY_FRONTEND_WEBHOOK" || curl -f -s -S -X GET "$COOLIFY_FRONTEND_WEBHOOK"
